name: Release APK

on:
  push:
    branches: [ "releases" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Decode persistent signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "${RUNNER_TEMP}/moneydelta-signing.jks"
          fi

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build signed Debug and Release APKs
        env:
          MONEYDELTA_KEYSTORE_PATH: ${{ runner.temp }}/moneydelta-signing.jks
          MONEYDELTA_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          MONEYDELTA_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          MONEYDELTA_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          VERSION_NAME="${TAG#v}"
          gradle assembleDebug assembleRelease \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="$VERSION_NAME" \
            --stacktrace

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/moneydelta-signing.jks"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoneyDelta-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          cp app/build/outputs/apk/release/app-release.apk "MoneyDelta-${TAG}-release.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "MoneyDelta-${TAG}-release.apk" --clobber
          else
            gh release create "$TAG" "MoneyDelta-${TAG}-release.apk" \
              --title "MoneyDelta $TAG" \
              --notes "Automated signed release from commit ${GITHUB_SHA} (versionCode ${{ github.run_number }}). Install \`MoneyDelta-${TAG}-release.apk\` directly on top of future or same-version builds signed with this key." \
              --latest
          fi
